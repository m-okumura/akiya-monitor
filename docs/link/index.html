<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>JKK空き家 — 建物を開く</title>
    <link rel="stylesheet" href="./link.css" />
  </head>
  <body>
    <h1>JKK 空き家検索</h1>
    <p class="note">
      JKK ねっとはメールからの<strong>住宅直リンク</strong>だと「混雑」等のエラーになることがあります。
      下の手順で公式の空き家検索から開いてください。
    </p>
    <p>建物名（表示）</p>
    <p class="name" id="building-name">（読み込み中…）</p>
    <p class="name kana" id="building-kana">（読み込み中…）</p>
    <ol>
      <li>下のボタンで <strong>JKK 空き家検索</strong>を開く</li>
      <li>条件画面の <strong>住宅名（カナ）</strong> に、下のカナを貼り付けて検索</li>
      <li>一覧の「詳細」から建物情報を確認</li>
    </ol>
    <div class="actions">
      <a
        class="button"
        href="https://jhomes.to-kousya.or.jp/search/jkknet/service/akiyaJyoukenStartInit"
        target="_blank"
        rel="noopener noreferrer"
      >JKK 空き家検索を開く</a>
      <button type="button" class="secondary" id="copy-name">住宅名（カナ）をコピー</button>
    </div>
    <p id="copy-status" aria-live="polite"></p>
    <p class="note">
      <a href="https://www.to-kousya.or.jp/kouei/to/jkk-net.html">空家検索/申込（JKK東京）</a>
    </p>
    <script src="./link.js" defer></script>
  </body>
</html>
