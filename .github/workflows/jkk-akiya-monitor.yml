name: JKK Akiya Monitor

on:
  schedule:
    # 毎日 7:00 JST（UTC 22:00）
    - cron: "0 22 * * *"
  workflow_dispatch:
    inputs:
      snapshot_email:
        description: 現時点の該当物件一覧をメール送信（差分は見ない）
        type: boolean
        default: false

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Restore listing state
        uses: actions/cache@v4
        with:
          path: .data/state.json
          key: jkk-akiya-monitor-state

      - name: Install dependencies
        run: npm ci

      - name: Run daily check
        env:
          NOTIFY_PROVIDER: resend
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          MENSEKI_MIN: "40"
          NOTIFY_ON_FIRST_RUN: "false"
          SNAPSHOT_EMAIL: ${{ github.event_name == 'workflow_dispatch' && inputs.snapshot_email == true && 'true' || 'false' }}
        run: npm run check
